<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos filtrados</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .ok { background: #e6f7e6; padding: 8px; border-radius: 4px; }
        .error { background: #fde8e8; color: #a00; padding: 8px; border-radius: 4px; }
        .campo-error { color: #a00; font-size: 0.9em; }
        label { display: inline-block; width: 110px; }
        div.campo { margin-bottom: 10px; }
    </style>
</head>
<body>
<h1>Productos de <span th:text="${categoria.nombre}"></span> con precio mayor a <span th:text="${minimo}"></span></h1>

<p th:if="${#lists.isEmpty(productos)}">No hay productos que cumplan el filtro.</p>

<table th:unless="${#lists.isEmpty(productos)}">
    <thead>
    <tr><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th></tr>
    </thead>
    <tbody>
    <tr th:each="p : ${productos}">
        <td th:text="${p.nombre}"></td>
        <td th:text="${p.categoria.nombre}"></td>
        <td th:text="${p.precio}"></td>
        <td th:text="${p.stock}"></td>
    </tr>
    </tbody>
</table>

<p><a th:href="@{/productos}">Volver a productos</a></p>
</body>
</html>
