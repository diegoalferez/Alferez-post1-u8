<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .ok { background: #e6f7e6; padding: 8px; border-radius: 4px; }
        .error { background: #fde8e8; color: #a00; padding: 8px; border-radius: 4px; }
        .campo-error { color: #a00; font-size: 0.9em; }
        label { display: inline-block; width: 110px; }
        div.campo { margin-bottom: 10px; }
    </style>
</head>
<body>
<h1 th:text="${titulo}"></h1>

<form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
    <input type="hidden" th:field="*{id}" />

    <div class="campo">
        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" />
        <span class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
    </div>

    <div class="campo">
        <label>Precio:</label>
        <input type="number" step="0.01" th:field="*{precio}" />
        <span class="campo-error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>
    </div>

    <div class="campo">
        <label>Stock:</label>
        <input type="number" th:field="*{stock}" />
        <span class="campo-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
    </div>

    <div class="campo">
        <label>Categoría:</label>
        <select name="categoriaId" required>
            <option value="">-- Selecciona --</option>
            <option th:each="c : ${categorias}"
                    th:value="${c.id}"
                    th:text="${c.nombre}"
                    th:selected="${categoriaIdSel != null and categoriaIdSel == c.id}"></option>
        </select>
    </div>

    <button type="submit">Guardar</button>
    <a th:href="@{/productos}">Cancelar</a>
</form>
</body>
</html>
