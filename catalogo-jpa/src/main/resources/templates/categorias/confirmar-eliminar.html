<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Eliminar categoría</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .ok { background: #e6f7e6; padding: 8px; border-radius: 4px; }
        .error { background: #fde8e8; color: #a00; padding: 8px; border-radius: 4px; }
        .campo-error { color: #a00; font-size: 0.9em; }
        label { display: inline-block; width: 110px; }
        div.campo { margin-bottom: 10px; }
    </style>
</head>
<body>
<h1>Eliminar categoría</h1>
<p>¿Seguro que deseas eliminar la siguiente categoría?</p>

<p><strong>Nombre:</strong> <span th:text="${categoria.nombre}"></span></p>
<p><strong>Descripción:</strong> <span th:text="${categoria.descripcion}"></span></p>

<form th:action="@{/categorias/eliminar/{id}(id=${categoria.id})}" method="post">
    <button type="submit">Sí, eliminar</button>
    <a th:href="@{/categorias}">Cancelar</a>
</form>
</body>
</html>
